- aid: veryfi:receipts-invoices-api
  name: Veryfi Receipts & Invoices API
  description: >-
    The Veryfi Receipts & Invoices API uses AI-powered OCR to extract structured JSON data from receipts,
    invoices, bills, and other financial documents. It supports documents in PDF and image formats and
    returns line-item level data including taxes, totals, vendor details, and barcodes.
  humanURL: https://docs.veryfi.com/
  tags:
