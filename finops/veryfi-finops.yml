description: 'FOCUS-aligned FinOps shape for Veryfi: per-document metered pricing on the Starter
  plan ($500/mo minimum, document-type-specific unit prices) and a Free quota tier; Growth plan is
  custom-quoted with volume discounts. The dominant unit of consumption is the processed document.'
