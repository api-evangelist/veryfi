principles:
  - name: Visibility
    description: Track per-document consumption via the Veryfi Hub usage views and the API Hub
      account page; document-type rates are itemized on the monthly invoice.
  - name: Allocation
    description: Tag uploads with the originating tenant / business unit at the API request layer
      (e.g. category or external_id) so document-type cost can be attributed downstream.
  - name: Optimization
    description: Right-size the document mix toward lower-priced types (receipts at $0.08 vs invoices
      at $0.16, checks/statements at $0.25); commit to the 12-month Starter plan for the
      one-cent-per-document discount; aggregate volume into the Growth plan when usage justifies it.
  - name: Accountability
    description: Assign the Veryfi account owner from the integrating product team; finance reconciles
      monthly against the $500 plan minimum and per-document overage lines on the invoice.
