openapi: 3.1.0
info:
  title: Veryfi OCR API
  description: >-
    The Veryfi OCR API extracts structured data from financial documents
    including receipts, invoices, bank statements, checks, W-2s, W-8s, W-9s,
    business cards, contracts, and more. The API uses AI-powered OCR to capture
    line items, taxes, totals, barcodes, vendor details, and other financial
    data across 91 currencies and 38 languages with enterprise-grade accuracy.
  version: v8
  contact:
    name: Veryfi Support
    url: https://docs.veryfi.com/
    email: support@veryfi.com
  license:
    name: Proprietary
    url: https://www.veryfi.com/terms/
servers:
  - url: https://api.veryfi.com/api/v8
    description: Veryfi OCR API v8
security:
  - clientId: []
    apiKey: []
paths:
  /partner/documents:
    post:
      operationId: processDocument
      summary: Process a Document
      description: >-
        Submit a document (receipt, invoice, bill, or other financial document)
        for AI-powered OCR extraction. Returns structured JSON with vendor
        details, line items, taxes, totals, and other captured fields.
        Supports file uploads, URLs, base64-encoded data, and S3 references.
        Optionally supports asynchronous processing via webhooks.
      tags:
        - Documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '201':
          description: Document successfully processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad request - malformed or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listDocuments
      summary: List All Documents
      description: >-
        Retrieve a paginated list of previously processed documents with
        optional filtering by date range, tags, and other criteria.
      tags:
        - Documents
      parameters:
        - name: created_date__gt
          in: query
          required: false
          description: Filter documents created after this date (format YYYY-MM-DD+HH:MM:SS)
          schema:
            type: string
        - name: created_date__lt
          in: query
          required: false
          description: Filter documents created before this date
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          description: Number of documents per page
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/documents/{documentId}:
    get:
      operationId: getDocument
      summary: Get a Document
      description: Retrieve a previously processed document by its ID.
      tags:
        - Documents
      parameters:
        - name: documentId
          in: path
          required: true
          description: Unique document identifier
          schema:
            type: integer
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateDocument
      summary: Update a Document
      description: Update metadata, tags, or category for a processed document.
      tags:
        - Documents
      parameters:
        - name: documentId
          in: path
          required: true
          description: Unique document identifier
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: Updated tags list
                category:
                  type: string
                  description: Updated category
                external_id:
                  type: string
                  description: External system reference ID
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteDocument
      summary: Delete a Document
      description: Permanently delete a processed document and its extracted data.
      tags:
        - Documents
      parameters:
        - name: documentId
          in: path
          required: true
          description: Unique document identifier
          schema:
            type: integer
      responses:
        '200':
          description: Document deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/bank-statements:
    post:
      operationId: processBankStatement
      summary: Process a Bank Statement
      description: >-
        Submit a bank statement for AI-powered data extraction. Returns
        structured transaction data, account information, balances, and
        metadata. Supports PDF, image formats, and multi-page documents.
      tags:
        - Bank Statements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '201':
          description: Bank statement processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatement'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listBankStatements
      summary: List All Bank Statements
      description: Retrieve a list of previously processed bank statements.
      tags:
        - Bank Statements
      responses:
        '200':
          description: List of bank statements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankStatement'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/bank-statements/{documentId}:
    get:
      operationId: getBankStatement
      summary: Get a Bank Statement
      description: Retrieve a specific processed bank statement by ID.
      tags:
        - Bank Statements
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bank statement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankStatement'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteBankStatement
      summary: Delete a Bank Statement
      description: Permanently delete a processed bank statement.
      tags:
        - Bank Statements
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/checks:
    post:
      operationId: processCheck
      summary: Process a Check
      description: >-
        Submit a check image for OCR extraction including bank routing number,
        account number, check number, payee, amount, and date.
      tags:
        - Checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '201':
          description: Check processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listChecks
      summary: List All Checks
      description: Retrieve a list of previously processed checks.
      tags:
        - Checks
      responses:
        '200':
          description: List of checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Check'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/checks/{documentId}:
    get:
      operationId: getCheck
      summary: Get a Check
      description: Retrieve a specific processed check by ID.
      tags:
        - Checks
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Check details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteCheck
      summary: Delete a Check
      description: Permanently delete a processed check.
      tags:
        - Checks
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/w2s:
    post:
      operationId: processW2
      summary: Process a W-2 Form
      description: >-
        Submit a W-2 tax form for OCR extraction including employer details,
        employee information, wages, tax withholdings, and all W-2 box values.
      tags:
        - W-2 Forms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProcessDocumentRequest'
      responses:
        '201':
          description: W-2 processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/W2Form'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listW2s
      summary: List All W-2 Forms
      description: Retrieve a list of previously processed W-2 forms.
      tags:
        - W-2 Forms
      responses:
        '200':
          description: List of W-2 forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/W2Form'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/w2s/{documentId}:
    get:
      operationId: getW2
      summary: Get a W-2 Form
      description: Retrieve a specific processed W-2 form by ID.
      tags:
        - W-2 Forms
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: W-2 form details
          content:
            application/json:
              schema:
