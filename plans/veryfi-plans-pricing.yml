specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Veryfi
providerId: veryfi
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - OCR
  - Document AI
  - Data Extraction
  - Receipts
  - Invoices
  - Expense Management
description: Veryfi prices its OCR / document-extraction APIs with a freemium entry tier (100 docs/mo)
  plus a metered Starter plan that bills per document by document type, and a Growth plan with
  volume discounts and add-ons negotiated directly. Per-document rates are documented on the public
  pricing page; a one-cent-per-doc discount is offered on Starter with a 12-month commitment.
sources:
  - https://www.veryfi.com/pricing/
plans:
  - id: veryfi-free
    name: Free
    type: freemium
    description: Free tier for evaluation; up to 100 documents per month across all document types.
    entries:
      - label: Documents per month
        name: documents_included
        type: quota
        metric: document
        limit: 100
        timeFrame: month
        geo: global
        unit: 1
        price: '$0'
        userMultiplied: false
    elements:
      - name: All document types
      - name: SDKs
      - name: Limited storage
      - name: Email support
  - id: veryfi-starter
    name: Starter
    type: usage-based
    description: Per-document metered plan with a $500/mo minimum commitment. Per-document price
      varies by document type.
    entries:
      - label: Plan minimum
        name: monthly_minimum
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: '$500+/mo (minimum commitment)'
        userMultiplied: false
      - label: Receipts
        name: receipts
        type: metered
        metric: document
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$0.08 per receipt'
        userMultiplied: false
      - label: Invoices
        name: invoices
        type: metered
        metric: document
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$0.16 per invoice'
        userMultiplied: false
      - label: Bank Checks
        name: bank_checks
        type: metered
        metric: document
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$0.25 per check'
        userMultiplied: false
      - label: Bank Statements
        name: bank_statements
        type: metered
        metric: document
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$0.25 per statement'
        userMultiplied: false
      - label: W-2 / W-9 forms
        name: w2_w9_forms
        type: metered
        metric: document
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '$0.16 per form'
        userMultiplied: false
      - label: Other documents
        name: other_documents
        type: metered
        metric: document
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact for pricing
        userMultiplied: false
    elements:
      - name: All document types
      - name: SDKs
      - name: OpenClaw Skill
      - name: Optional add-ons
      - name: API Hub access
      - name: Email support
      - name: 1-cent-per-document discount with 12-month commitment
  - id: veryfi-growth
    name: Growth
    type: enterprise
    description: Volume-discounted custom plan with add-ons (unlimited storage, custom retention,
      model training, SLA, SAML SSO, enhanced support).
    entries:
      - label: Custom Quote
        name: custom_quote
        type: flat
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: custom (volume discounts)
        userMultiplied: false
    elements:
      - name: All document types
      - name: SDKs
      - name: Multiple add-ons
      - name: Unlimited storage
      - name: Custom data retention
      - name: Model training
      - name: SLA options
      - name: SAML SSO
      - name: Enhanced support
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
