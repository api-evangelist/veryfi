specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Veryfi
providerId: veryfi
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - OCR
  - Document AI
  - Data Extraction
description: Veryfi does not publish a public rate-limit table for its OCR / document APIs on the
  marketing or documentation hub pages reviewed at reconciliation time. Per-document quotas are
  enforced via the plan (e.g. 100/mo on Free); request-rate limits, if any, are not publicly
  documented and should be confirmed with Veryfi support for production workloads.
sources:
  - https://www.veryfi.com/pricing/
  - https://docs.veryfi.com/
responseCodes:
  throttled: 429
limits:
  - name: Plan-level monthly document quota
    scope: account
    metric: documents_per_month
    limit: 100
    timeFrame: month
    notes: Free tier; Starter and Growth plans are metered with no fixed monthly cap (subject to
      minimum commitment / volume agreement).
  - name: Per-second / per-minute request rate
    scope: account
    metric: varies
    limit: not publicly documented; contact Veryfi support for production allocations
policies:
  - name: Quota model
    description: The Free tier hard-caps document processing at the plan quota; metered plans bill
      per document with no fixed request-rate ceiling published.
  - name: Backoff
    description: Clients receiving 429 responses should implement exponential backoff with jitter
      and honor any Retry-After header returned.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
