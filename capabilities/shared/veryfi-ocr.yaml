naftiko: "1.0.0-alpha1"

info:
  label: "Veryfi OCR API"
  description: >-
    Veryfi AI-powered OCR API for extracting structured data from receipts,
    invoices, bank statements, checks, W-2s, W-9s, and custom documents.
    Supports 91 currencies and 38 languages with enterprise-grade accuracy.
  tags:
    - AI
    - Bank Statements
    - Checks
    - Document Processing
    - Finance
    - Invoices
    - OCR
    - Receipts
    - Tax Forms
    - Veryfi
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      VERYFI_CLIENT_ID: VERYFI_CLIENT_ID
      VERYFI_API_KEY: VERYFI_API_KEY
      VERYFI_USERNAME: VERYFI_USERNAME

capability:
  consumes:
    - type: http
      namespace: veryfi
      baseUri: "https://api.veryfi.com/api/v8"
      description: "Veryfi OCR API v8 for document data extraction"
      authentication:
        type: apikey
        key: AUTHORIZATION
        value: "apikey {{env.VERYFI_USERNAME}}:{{env.VERYFI_API_KEY}}"
        placement: header
      resources:
        - name: documents
          path: /partner/documents
          description: "Receipts and invoices processing"
          operations:
            - name: process-document
              method: POST
              description: "Process a Document"
              body:
                type: json
                data:
                  file_url: "{{tools.file_url}}"
                  tags: "{{tools.tags}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-documents
              method: GET
              description: "List All Documents"
              inputParameters:
                - name: created_date__gt
                  in: query
                  type: string
                  required: false
                  description: "Filter by creation date"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-document
              method: GET
              description: "Get a Document"
              inputParameters:
                - name: documentId
                  in: path
                  type: integer
                  required: true
                  description: "Document ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-document
              method: DELETE
              description: "Delete a Document"
              inputParameters:
                - name: documentId
                  in: path
                  type: integer
                  required: true
                  description: "Document ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: bank-statements
          path: /partner/bank-statements
          description: "Bank statement processing"
          operations:
            - name: process-bank-statement
              method: POST
              description: "Process a Bank Statement"
              body:
                type: json
                data:
                  file_url: "{{tools.file_url}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-bank-statements
              method: GET
              description: "List All Bank Statements"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-bank-statement
              method: GET
              description: "Get a Bank Statement"
              inputParameters:
                - name: documentId
                  in: path
                  type: integer
                  required: true
                  description: "Bank statement ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-bank-statement
              method: DELETE
              description: "Delete a Bank Statement"
              inputParameters:
                - name: documentId
                  in: path
                  type: integer
                  required: true
                  description: "Bank statement ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: checks
          path: /partner/checks
          description: "Check processing"
          operations:
            - name: process-check
              method: POST
              description: "Process a Check"
              body:
                type: json
                data:
                  file_url: "{{tools.file_url}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-checks
              method: GET
              description: "List All Checks"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-check
              method: GET
              description: "Get a Check"
              inputParameters:
                - name: documentId
                  in: path
                  type: integer
                  required: true
                  description: "Check ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: w2s
          path: /partner/w2s
          description: "W-2 tax form processing"
          operations:
            - name: process-w2
              method: POST
              description: "Process a W-2 Form"
              body:
                type: json
                data:
                  file_url: "{{tools.file_url}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-w2s
              method: GET
              description: "List All W-2 Forms"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-w2
              method: GET
              description: "Get a W-2 Form"
              inputParameters:
                - name: documentId
                  in: path
                  type: integer
                  required: true
                  description: "W-2 form ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: w9s
          path: /partner/w9s
          description: "W-9 tax form processing"
          operations:
            - name: process-w9
              method: POST
              description: "Process a W-9 Form"
              body:
                type: json
                data:
                  file_url: "{{tools.file_url}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-w9s
              method: GET
              description: "List All W-9 Forms"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-w9
              method: GET
              description: "Get a W-9 Form"
              inputParameters:
                - name: documentId
                  in: path
                  type: integer
                  required: true
                  description: "W-9 form ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: any-documents
          path: /partner/any-documents
          description: "Custom blueprint document processing"
          operations:
            - name: process-any-document
              method: POST
              description: "Process Any Document"
              body:
                type: json
                data:
                  file_url: "{{tools.file_url}}"
                  blueprint_name: "{{tools.blueprint_name}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-any-documents
              method: GET
              description: "List Any Documents"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: classify
          path: /partner/classify
          description: "Document type classification"
          operations:
            - name: classify-document
              method: POST
              description: "Classify a Document"
              body:
                type: json
                data:
                  file_url: "{{tools.file_url}}"
                  document_types: "{{tools.document_types}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: veryfi-rest
      resources:
        - path: /v1/documents
          name: documents
          description: "Process and manage receipt/invoice documents"
          operations:
            - method: POST
              name: process-document
              description: "Process a Document"
            - method: GET
              name: list-documents
              description: "List All Documents"
        - path: /v1/documents/{documentId}
          name: document
          description: "Single document operations"
          operations:
            - method: GET
              name: get-document
              description: "Get a Document"
            - method: DELETE
              name: delete-document
              description: "Delete a Document"
        - path: /v1/bank-statements
          name: bank-statements
          description: "Bank statement processing"
          operations:
            - method: POST
              name: process-bank-statement
              description: "Process a Bank Statement"
        - path: /v1/w2s
          name: w2s
          description: "W-2 form processing"
          operations:
            - method: POST
              name: process-w2
              description: "Process a W-2 Form"
        - path: /v1/classify
          name: classify
          description: "Document classification"
          operations:
            - method: POST
              name: classify-document
              description: "Classify a Document"

    - type: mcp
      port: 9100
      namespace: veryfi-mcp
      transport: http
      tools:
        - name: process-document
          description: "Extract structured data from a receipt or invoice URL"
          hints:
            readOnly: false
            openWorld: false
        - name: list-documents
          description: "List previously processed receipts and invoices"
          hints:
            readOnly: true
            openWorld: true
        - name: get-document
          description: "Get a specific processed document by ID"
          hints:
            readOnly: true
            openWorld: false
        - name: process-bank-statement
          description: "Extract structured transaction data from a bank statement URL"
          hints:
            readOnly: false
            openWorld: false
        - name: process-check
          description: "Extract routing number, account number, and amount from a check image"
          hints:
            readOnly: false
            openWorld: false
        - name: process-w2
          description: "Extract wage and tax data from a W-2 form"
          hints:
            readOnly: false
            openWorld: false
        - name: process-w9
          description: "Extract taxpayer identification data from a W-9 form"
          hints:
            readOnly: false
            openWorld: false
        - name: process-any-document
          description: "Extract data from any document using a custom blueprint"
          hints:
            readOnly: false
            openWorld: false
        - name: classify-document
          description: "Classify a document to determine its type before processing"
          hints:
            readOnly: true
            openWorld: false
